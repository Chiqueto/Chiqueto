<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#190E24" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59879" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="44" y1="70" x2="430" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 50) rotate(35) scale(340 180)">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 190) rotate(-25) scale(320 180)">
      <stop offset="0%" stop-color="#F59879" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F59879" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <clipPath id="clipBanner">
      <rect x="0" y="0" width="900" height="240" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#clipBanner)">
    <rect width="900" height="240" rx="18" fill="url(#bgGrad)" />
    <rect width="900" height="240" fill="url(#grid)" />
    <rect width="900" height="240" fill="url(#glowLeft)" />
    <rect width="900" height="240" fill="url(#glowRight)" />

    <!-- Left Section -->
    <rect x="44" y="30" width="176" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="58" cy="42" r="3.5" fill="#22C55E" />
    <text x="69" y="45.5" fill="#BAE6FD" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.8">FULL STACK ENGINEER</text>

    <text x="44" y="96" fill="url(#nameGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.6">Luís Felipe Chiqueto</text>

    <text x="44" y="128" fill="#CBD5E1" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500">Web, Mobile, APIs Escaláveis &amp; Inteligência Artificial</text>

    <text x="44" y="154" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400">Engenharia de Software @ UNIFACEF  •  São Joaquim da Barra, SP</text>

    <!-- Tech Pills -->
    <rect x="44" y="178" width="104" height="26" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#F59879" stroke-opacity="0.35" />
    <text x="96" y="195" text-anchor="middle" fill="#FDE68A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">Java &amp; Spring</text>

    <rect x="156" y="178" width="124" height="26" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.35" />
    <text x="218" y="195" text-anchor="middle" fill="#BAE6FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">Next.js &amp; Angular</text>

    <rect x="288" y="178" width="102" height="26" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#818CF8" stroke-opacity="0.35" />
    <text x="339" y="195" text-anchor="middle" fill="#C7D2FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">Kotlin &amp; RN</text>

    <rect x="398" y="178" width="84" height="26" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#34D399" stroke-opacity="0.35" />
    <text x="440" y="195" text-anchor="middle" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">AI &amp; 3D</text>

    <!-- Right Code Card -->
    <rect x="512" y="28" width="348" height="184" rx="14" fill="#0B1120" fill-opacity="0.92" stroke="#334155" stroke-width="1" />
    <rect x="512" y="28" width="348" height="32" rx="14" fill="#111827" />
    <rect x="512" y="46" width="348" height="14" fill="#111827" />
    <line x1="512" y1="60" x2="860" y2="60" stroke="#1E293B" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="530" cy="44" r="4.5" fill="#FF5F56" />
    <circle cx="545" cy="44" r="4.5" fill="#FFBD2E" />
    <circle cx="560" cy="44" r="4.5" fill="#27C93F" />
    <text x="686" y="47.5" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">profile.ts</text>

    <!-- Code Content -->
    <text x="530" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
      <tspan fill="#C084FC">const</tspan>
      <tspan fill="#E2E8F0"> dev </tspan>
      <tspan fill="#38BDF8">=</tspan>
      <tspan fill="#E2E8F0"> {</tspan>
    </text>
    <text x="546" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
      <tspan fill="#7DD3FC">role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">"Full Stack Developer"</tspan><tspan fill="#94A3B8">,</tspan>
    </text>
    <text x="546" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
      <tspan fill="#7DD3FC">backend</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#FDE68A">"Java"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FDE68A">"Spring"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FDE68A">"FastAPI"</tspan><tspan fill="#94A3B8">],</tspan>
    </text>
    <text x="546" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
      <tspan fill="#7DD3FC">frontend</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#FDE68A">"Next.js"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FDE68A">"Angular"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FDE68A">"3D"</tspan><tspan fill="#94A3B8">],</tspan>
    </text>
    <text x="546" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
      <tspan fill="#7DD3FC">mobile</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#FDE68A">"React Native"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FDE68A">"WearOS"</tspan><tspan fill="#94A3B8">]</tspan>
    </text>
    <text x="530" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
      <tspan fill="#E2E8F0">};</tspan>
    </text>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="238.5" rx="17.25" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
